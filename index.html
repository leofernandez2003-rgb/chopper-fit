<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Chopper Fit</title>
<meta name="description" content="Contador de calorías, agua, ayuno y peso con Chopper.">
<meta name="theme-color" content="#4caa60">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chopper Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<nav id="nav" hidden>
  <div class="tabs">
    <button data-act="nav" data-view="home" aria-label="Inicio">🏠</button>
    <button data-act="nav" data-view="retos" aria-label="Retos">⭐</button>
    <button data-act="nav" data-view="stats" aria-label="Progreso">📊</button>
    <button data-act="chat" aria-label="Chat con Chopper">💬</button>
  </div>
  <button class="fab" data-act="fab" aria-label="Agregar">+</button>
</nav>

<div id="sheet"></div>
<div id="toasts" aria-live="polite"></div>
<input type="date" id="datepick" tabindex="-1" aria-hidden="true">
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
